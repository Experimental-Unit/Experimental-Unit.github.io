# Substack Pipeline Configuration
# Copy this file and modify as needed

# Embedding model settings
embedding:
  # Provider: huggingface (free, local), openai, ollama
  provider: huggingface
  # Model name depends on provider:
  # - huggingface: all-MiniLM-L6-v2, all-mpnet-base-v2
  # - openai: text-embedding-3-small, text-embedding-ada-002
  # - ollama: nomic-embed-text
  model_name: all-MiniLM-L6-v2

# LLM settings (for summaries and glossary)
llm:
  # Provider: anthropic, openai, ollama
  provider: anthropic
  # Model name depends on provider:
  # - anthropic: claude-sonnet-4-20250514, claude-3-haiku-20240307
  # - openai: gpt-4o, gpt-4o-mini
  # - ollama: llama3, mistral
  model_name: claude-sonnet-4-20250514
  temperature: 0.3
  max_tokens: 4096

# Document processing settings
processing:
  # Size of text chunks for embedding
  chunk_size: 1000
  # Overlap between chunks
  chunk_overlap: 200
  # Minimum chunk size to process
  min_chunk_size: 100

# Vector store settings
collection_name: substack_posts

# Paths (relative to project root)
raw_data_dir: data/raw
processed_data_dir: data/processed
output_dir: output
site_dir: site
vectorstore_path: output/database/chroma
