name: OpenClaw Agent Tasks

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened, labeled]
  pull_request:
    types: [opened, labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  # Handle OpenClaw commands in issue/PR comments
  handle-command:
    name: Handle OpenClaw Command
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'issue_comment' &&
       startsWith(github.event.comment.body, '/openclaw')) ||
      (github.event_name == 'issues' &&
       contains(github.event.issue.labels.*.name, 'openclaw')) ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'openclaw'))
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pnpm add -g openclaw@latest

      - name: Parse command
        id: parse
        run: |
          COMMENT="${{ github.event.comment.body }}"
          if [[ "$COMMENT" == "/openclaw summarize"* ]]; then
            echo "command=summarize" >> $GITHUB_OUTPUT
          elif [[ "$COMMENT" == "/openclaw glossary"* ]]; then
            echo "command=glossary" >> $GITHUB_OUTPUT
          elif [[ "$COMMENT" == "/openclaw search"* ]]; then
            QUERY=$(echo "$COMMENT" | sed 's|/openclaw search ||')
            echo "command=search" >> $GITHUB_OUTPUT
            echo "query=$QUERY" >> $GITHUB_OUTPUT
          elif [[ "$COMMENT" == "/openclaw site"* ]]; then
            echo "command=site" >> $GITHUB_OUTPUT
          elif [[ "$COMMENT" == "/openclaw help"* ]]; then
            echo "command=help" >> $GITHUB_OUTPUT
          else
            echo "command=unknown" >> $GITHUB_OUTPUT
          fi

      - name: Run summarize
        if: steps.parse.outputs.command == 'summarize'
        run: python -m pipeline.main summarize --input data/raw
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Run glossary
        if: steps.parse.outputs.command == 'glossary'
        run: python -m pipeline.main glossary --input data/raw
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Run search
        if: steps.parse.outputs.command == 'search'
        id: search
        run: |
          RESULT=$(python -m pipeline.main search --query "${{ steps.parse.outputs.query }}" 2>&1)
          echo "result<<EOF" >> $GITHUB_OUTPUT
          echo "$RESULT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Run site generation
        if: steps.parse.outputs.command == 'site'
        run: python -m pipeline.main site --input data/raw

      - name: Post help comment
        if: steps.parse.outputs.command == 'help'
        uses: actions/github-script@v7
        with:
          script: |
            const helpText = `## OpenClaw Commands

            Available commands:
            - \`/openclaw summarize\` - Generate AI summaries for posts
            - \`/openclaw glossary\` - Extract glossary terms
            - \`/openclaw search <query>\` - Search the archive
            - \`/openclaw site\` - Generate the static site
            - \`/openclaw help\` - Show this help message

            **Note:** Commands require the \`ANTHROPIC_API_KEY\` secret to be set.
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: helpText
            });

      - name: Post search results
        if: steps.parse.outputs.command == 'search'
        uses: actions/github-script@v7
        with:
          script: |
            const result = `${{ steps.search.outputs.result }}`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Search Results\n\n\`\`\`\n${result}\n\`\`\``
            });

      - name: Post completion comment
        if: steps.parse.outputs.command != 'help' && steps.parse.outputs.command != 'search' && steps.parse.outputs.command != 'unknown'
        uses: actions/github-script@v7
        with:
          script: |
            const command = '${{ steps.parse.outputs.command }}';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `OpenClaw \`${command}\` completed successfully.`
            });
